services:
  bot-postgres:
    image: postgres:16
    container_name: bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
      # lets the Code node write attachment files to disk
      NODE_FUNCTION_ALLOW_BUILTIN: fs
    volumes:
      # existing n8n data (workflows, credentials)
      - n8n_data:/home/node/.n8n
      # bronze attachments: container path -> 05_data/bronze in this repo
      - ./05_data/bronze:/home/node/.n8n-files/bronze

volumes:
  bot_pgdata:
  n8n_data:
    external: true
